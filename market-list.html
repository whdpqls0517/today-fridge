<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매장 둘러보기 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./today-fridge.css" />
</head>
<body class="search-screen" data-list-category="market">
  <main class="search-page result-page" aria-label="매장 둘러보기 목록 화면">
    <header class="search-header">
      <a class="search-back" href="./main.html" data-back-button aria-label="이전 화면으로 돌아가기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </a>
      <div class="detail-title">매장 둘러보기</div>
    </header>

    <section class="result-summary">
      <span>매장 상시 상품</span>
      <h1>방문해서 살 수 있는 상품</h1>
      <p>매장에 준비된 신선식품과 추천 상품을 미리 둘러보세요.</p>
    </section>

    <section class="popular-products" aria-label="매장 상품">
      <div class="search-section-title">
        <h2>매장 상품 목록</h2>
      </div>
      <div class="popular-track" id="category-list-track" style="flex-wrap: wrap; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; overflow: visible;"></div>
    </section>
  </main>

  <script src="./js/db.js"></script>
  <script src="./js/product-rules.js"></script>
  <script src="./js/back-navigation.js"></script>
  <script src="./js/search.js"></script>
  <script src="./js/favorites.js"></script>
  <script src="./js/receipt-launcher.js"></script>
</body>
</html>
