<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>후기 작성 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./css/today-fridge.css" />
  <link rel="stylesheet" href="./css/review-write.css">
</head>
<body>
  <main class="review-write-page">
    <header><a id="review-back-link" href="./reviews.html" aria-label="이전 페이지로 돌아가기">‹</a><h1>후기 작성</h1><i></i></header>
    <section class="review-order-card" id="review-order-card"></section>
    <form id="review-write-form">
      <label id="fruit-type-picker" class="fruit-type-picker" hidden>후기 남길 상품
        <select id="review-fruit-type"><option value="">상품을 선택해 주세요</option></select>
        <em>직접 구매하거나 드셔본 상품의 후기만 작성해 주세요.</em>
      </label>
      <fieldset><legend>상품은 만족하셨나요?</legend><div class="rating-picker" id="rating-picker">
        <button type="button" data-rating="1">★</button><button type="button" data-rating="2">★</button><button type="button" data-rating="3">★</button><button type="button" data-rating="4">★</button><button type="button" data-rating="5">★</button>
      </div></fieldset>
      <label>후기 내용<textarea id="review-content" maxlength="500" required placeholder="상품에 대한 솔직한 후기를 남겨주세요."></textarea><small><span id="review-length">0</span>/500</small></label>
      <label class="review-photo-field">사진 첨부
        <input id="review-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <small>최대 10장 · 한 장당 5MB 이하</small>
      </label>
      <div class="review-photo-preview" id="review-photo-preview" aria-live="polite"></div>
      <button class="review-submit" type="submit">후기 등록</button>
    </form>
    <div class="review-write-message" id="review-write-message" role="status"></div>
  </main>
  <script src="./js/auth-session.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/review-write.js"></script>
</body>
</html>
