<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>검색 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./css/today-fridge.css" />
</head>
<body class="search-screen">
  <!-- 검색 전용 페이지입니다. 최근 검색어, 급상승 검색어, 인기 상품을 보여줍니다. -->
  <main class="search-page" aria-label="상품 검색 화면">
    <header class="search-header">
      <a class="search-back" href="./index.html" data-back-button aria-label="이전 화면으로 돌아가기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </a>
      <form class="search-field" data-search-form autocomplete="off">
        <input data-search-input type="search" placeholder="보따리, 과일, 밀키트 검색" autocomplete="off" />
        <button class="search-submit" type="submit" aria-label="검색하기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.1"/><path d="m16 16 4 4"/></svg>
        </button>
      </form>
    </header>

    <section class="recent-searches" data-recent-section aria-label="최근 검색어">
      <div class="search-section-title">
        <h2>최근 검색어</h2>
        <button type="button" data-clear-recent>전체삭제</button>
      </div>
      <div class="keyword-chips" data-recent-list>
        <button type="button" data-search-keyword="감귤">감귤 <span data-remove-keyword>×</span></button>
        <button type="button" data-search-keyword="토마토">토마토 <span data-remove-keyword>×</span></button>
        <button type="button" data-search-keyword="해산물">해산물 <span data-remove-keyword>×</span></button>
        <button type="button" data-search-keyword="샐러드">샐러드 <span data-remove-keyword>×</span></button>
        <button type="button" data-search-keyword="보따리">보따리 <span data-remove-keyword>×</span></button>
      </div>
    </section>

    <section class="trend-searches recommended-searches" aria-label="추천 검색어">
      <div class="search-section-title search-rank-title">
        <div>
          <h2>추천 검색어</h2>
          <span>판매 중 상품 기준</span>
        </div>
      </div>
      <div class="recommended-list" data-trend-list></div>
    </section>

    <section class="popular-products" aria-label="인기 상품">
      <div class="search-section-title">
        <h2>인기 상품</h2>
        <a href="#">전체보기</a>
      </div>
      <div class="popular-track" id="search-popular-track">
        <!-- JS로 동적 렌더링 됩니다 -->
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="하단 네비게이션">
    <a href="./index.html">
      <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.5l8.5 7.3v9.7h-5.4v-6.2H8.9v6.2H3.5z"/></svg>
      홈
    </a>
    <a href="./category.html">
      <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.6"/><rect x="14" y="4" width="6" height="6" rx="1.6"/><rect x="4" y="14" width="6" height="6" rx="1.6"/><rect x="14" y="14" width="6" height="6" rx="1.6"/></svg>
      카테고리
    </a>
    <a href="./index.html#receipt" class="floating-ticket" aria-label="오늘 수령증 열기">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-280q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm0-160q17 0 28.5-11.5T520-480q0-17-11.5-28.5T480-520q-17 0-28.5 11.5T440-480q0 17 11.5 28.5T480-440Zm0-160q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm320 440H160q-33 0-56.5-23.5T80-240v-160q33 0 56.5-23.5T160-480q0-33-23.5-56.5T80-560v-160q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v160q-33 0-56.5 23.5T800-480q0 33 23.5 56.5T880-400v160q0 33-23.5 56.5T800-160Zm0-80v-102q-37-22-58.5-58.5T720-480q0-43 21.5-79.5T800-618v-102H160v102q37 22 58.5 58.5T240-480q0 43-21.5 79.5T160-342v102h640Z"/></svg>
    </a>
    <a href="./favorites.html">
      <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2S4.2 15.7 4.2 9.7a4.1 4.1 0 0 1 7-2.9l.8.8.8-.8a4.1 4.1 0 0 1 7 2.9c0 6-7.8 10.5-7.8 10.5z"/></svg>
      찜
    </a>
    <a href="./my-page.html">
      <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c.9-4 3.5-6.1 7.2-6.1s6.3 2.1 7.2 6.1"/></svg>
      마이
    </a>
  </nav>

  <script src="./js/auth-session.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/product-rules.js"></script>
  <script src="./js/back-navigation.js"></script>
  <script src="./js/search.js"></script>
  <script src="./js/favorites.js"></script>
  <script src="./js/receipt-launcher.js"></script>
  <script src="./js/content-protection.js"></script>
</body>
</html>
