<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 상세 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./css/today-fridge.css" />
  <style>
    /* 상품상세 레이아웃 */
    .detail-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: #f7f8fa;
      padding: 20px 18px 120px;
    }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 56px;
      border-bottom: 1px solid #edf0f2;
      margin-bottom: 15px;
    }
    .detail-back {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: #111820;
    }
    .detail-back svg {
      width: 31px;
      height: 31px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .detail-title {
      font-size: 18px;
      font-weight: 650;
      color: #20252b;
    }
    .detail-gallery {
      margin-top: 18px;
    }
    .detail-main-photo {
      position: relative;
      height: 306px;
      overflow: hidden;
      border-radius: 24px;
      background: #e8f0ec;
      box-shadow: 0 2px 8px rgba(21, 28, 35, 0.08);
    }
    .detail-main-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gallery-counter {
      position: absolute;
      right: 20px;
      bottom: 19px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(40, 45, 50, 0.72);
      color: #ffffff;
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
    }
    .detail-thumbnails {
      display: flex;
      gap: 14px;
      margin-top: 22px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .detail-thumbnails::-webkit-scrollbar {
      display: none;
    }
    .detail-thumbnail {
      flex: 0 0 auto;
      width: 76px;
      height: 76px;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 18px;
      background: #edf1ee;
      padding: 0;
    }
    .detail-thumbnail.is-active {
      border-color: var(--brand);
    }
    .detail-thumbnail img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .detail-info-block {
      margin-top: 42px;
    }
    .detail-type-chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 15px;
      border: 1px solid #dce9e2;
      border-radius: 999px;
      background: #f0f6f2;
      color: var(--brand);
      font-size: 13px;
      font-weight: 800;
    }
    .detail-info-block h1 {
      margin: 26px 0 14px;
      color: #06142a;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.25;
    }
    .detail-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: #304762;
      font-size: 14px;
      font-weight: 800;
    }
    .detail-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .detail-meta-item.review {
      color: var(--brand);
    }
    .detail-meta-item.review small {
      color: #8b9bb2;
      font-size: 13px;
      font-weight: 700;
    }
    .detail-meta-divider {
      width: 1px;
      height: 16px;
      background: #e0e6ee;
    }
    .detail-pickup-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      padding: 13px 15px;
      border: 1px solid #e3ebe6;
      border-radius: 12px;
      background: #f7faf8;
    }
    .detail-pickup-info span {
      color: #718078;
      font-size: 12px;
      font-weight: 750;
    }
    .detail-pickup-info strong {
      color: #176d50;
      font-size: 14px;
      font-weight: 850;
    }
    .detail-deadline-icon {
      position: relative;
      width: 18px;
      height: 18px;
      border: 2px solid var(--brand);
      border-radius: 50%;
    }
    .detail-deadline-icon::before,
    .detail-deadline-icon::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 3px;
      width: 2px;
      height: 6px;
      border-radius: 999px;
      background: var(--brand);
      transform-origin: bottom center;
    }
    .detail-deadline-icon::after {
      height: 5px;
      transform: rotate(105deg);
    }
    .detail-description {
      margin: 20px 0 0;
      color: #60718c;
      font-size: 17px;
      line-height: 1.6;
    }
    .detail-price-box {
      margin-top: 18px;
    }
    .detail-price-box h2 {
      margin: 0;
      color: #17231d;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.2;
    }
    .detail-fruit-prices { display:grid; border-top:1px solid #e7ece9; border-bottom:1px solid #e7ece9; }
    .detail-fruit-prices > div { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:12px 2px; }
    .detail-fruit-prices > div + div { border-top:1px solid #edf1ef; }
    .detail-fruit-prices span { color:#65736c; font-size:13px; font-weight:650; }
    .detail-fruit-prices strong { color:#17231d; font-size:18px; font-weight:850; white-space:nowrap; }

    /* 원형 배지 CSS 정의 (today-fridge.css 템플릿 대응) */
    .detail-badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
      margin-bottom: 8px;
    }
    .detail-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 11px;
      border-radius: 999px; /* 알약/원형 스타일 */
      font-size: 12px;
      font-weight: 800;
      line-height: 1.4;
    }
    .detail-badge.urgent { background: #f8eceb; color: #d9383a; }
    .detail-badge.deadline { background: #fef7e7; color: #b47d00; }
    .detail-badge.popular { background: #eaf3ee; color: #1f5f43; }
    .detail-badge.muted { background: #f0f2f5; color: #8a94a0; }

    .price-strike {
      font-size: 14px;
      text-decoration: line-through;
      color: #b4bcc2;
      margin-left: 8px;
    }
    .tab-bar {
      display: flex;
      border-bottom: 2px solid #edf0f2;
      margin-top: 25px;
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 800;
      color: #8c969e;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      background: none;
      border: 0;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #1f5f43;
      border-bottom-color: #1f5f43;
    }
    .tab-content {
      padding: 20px 4px;
      font-size: 13px;
      line-height: 1.6;
      color: #454c55;
    }
    .detail-copy {
      margin: 0;
      color: #37423c;
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 450;
      line-height: 1.78;
      white-space: pre-line;
      word-break: keep-all;
    }

    /* 하단 바 & 테두리 제거된 깔끔한 찜 하트 전용 버튼 */
    .action-bar {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      transform: translateX(-50%);
      padding: 14px 18px 24px;
      background: #ffffff;
      box-shadow: 0 -10px 24px rgba(36, 41, 50, 0.08);
      z-index: 20;
    }
    .action-bar-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .action-favorite-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      height: 52px;
      border: none;
      background: transparent;
      color: #c4c9cf;
      font-size: 32px;
      cursor: pointer;
      transition: transform 0.15s ease, color 0.15s ease;
      line-height: 1;
    }
    .action-favorite-btn[aria-pressed="true"] {
      color: #ff4d4f;
    }

    .action-btn {
      flex: 1;
      height: 52px;
      border-radius: 12px;
      background: #1f5f43;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 16px rgba(31, 95, 67, 0.18);
      border: 0;
      cursor: pointer;
      text-decoration: none;
    }
    .action-btn.disabled {
      background: #ef4b43;
      box-shadow: 0 8px 16px rgba(239, 75, 67, 0.18);
    }
    .action-btn.restock {
      background: #e4e6e5;
      color: #666d69;
      box-shadow: none;
    }
    .action-btn:active, .action-favorite-btn:active {
      transform: scale(0.95);
    }
    .review-item-detail {
      border-bottom: 1px solid #edf0f2;
      padding: 14px 0;
    }
    .review-item-detail:last-child {
      border-bottom: 0;
    }
    .detail-spec-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .detail-spec-card {
      padding: 14px;
      border: 1px solid #edf0f2;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(36, 41, 50, 0.04);
    }
    .detail-spec-card strong {
      display: block;
      color: #17212c;
      font-size: 14px;
      font-weight: 900;
    }
    .detail-spec-card p {
      margin: 7px 0 0;
      color: #5e6861;
      font-size: 13px;
      font-weight: 750;
    }
    .store-purchase-note {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: #eef7f2;
      color: #1f5f43;
      font-size: 13px;
      font-weight: 850;
    }
    .option-sheet[hidden]{display:none}.option-sheet{position:fixed;inset:0;z-index:1200;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,28,24,.48);padding:18px}.option-sheet-panel{width:min(100%,560px);max-height:min(78vh,720px);overflow:auto;background:#fff;border-radius:22px 22px 16px 16px;padding:20px;box-shadow:0 22px 60px rgba(11,31,22,.22)}.option-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.option-sheet-head h2{font-size:19px;margin:0 0 5px}.option-sheet-head p{font-size:12px;color:#758078;margin:0}.option-sheet-close{border:0;background:#f2f5f3;border-radius:50%;width:36px;height:36px;font-size:21px}.option-choice-list{display:grid;gap:9px}.option-choice{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;border:1px solid #dde6e1;border-radius:14px;padding:14px;background:#fff}.option-choice.is-selected{border-color:#4f8f70;background:#f6faf8}.option-choice-info{display:grid;gap:4px}.option-choice-info strong{font-size:15px}.option-choice-info span{font-size:13px;color:#526159}.option-choice-info small{font-size:11px;color:#8a958f}.option-choice-qty{display:flex;align-items:center;gap:7px}.option-choice-qty button{border:1px solid #d5dfda;background:#fff;border-radius:9px;width:32px;height:32px;font-size:18px}.option-choice-qty b{min-width:22px;text-align:center}.option-sheet-summary{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;padding-top:16px;border-top:1px solid #e5ebe8}.option-sheet-summary strong{font-size:19px}.option-sheet-continue{width:100%;border:0;border-radius:13px;background:#1d624a;color:#fff;padding:15px;font-size:15px;font-weight:800}.option-sheet-continue:disabled{background:#cdd5d1}
  </style>
</head>
<body class="search-screen">
  <main class="detail-container" aria-label="상품 상세 화면">
    <header class="detail-header">
      <a class="detail-back" href="./search.html" data-back-button aria-label="이전 화면으로 돌아가기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </a>
      <div class="detail-title">상세보기</div>
    </header>

    <!-- 상품 정보 렌더링 영역 -->
    <div id="product-detail-content"></div>

    <!-- 탭 메뉴 -->
    <nav class="tab-bar" aria-label="상세 정보 메뉴">
      <button class="tab-btn active" onclick="switchDetailTab('desc', this)">상세설명</button>
      <button class="tab-btn" id="tab-reviews-btn" onclick="switchDetailTab('reviews', this)">후기란</button>
      <button class="tab-btn" onclick="switchDetailTab('inquiry', this)">문의하기</button>
    </nav>

    <!-- 탭별 내용 영역 -->
    <div id="tab-desc" class="tab-content"></div>
    <div id="tab-reviews" class="tab-content" style="display:none;"></div>
    <div id="tab-inquiry" class="tab-content" style="display:none;">
      <div style="background: #f8f9fa; padding: 14px; border-radius: 12px; margin-bottom: 20px;">
        <h4 style="margin: 0 0 10px 0; font-size: 14px; font-weight: 800; color: #1f5f43;">🏪 사장님께 문의하기</h4>
        <textarea id="inquiry-text" placeholder="문의하실 내용을 입력해 주세요." style="width: 100%; height: 80px; border: 1px solid #d8dde2; border-radius: 8px; padding: 10px; font-family: inherit; font-size: 13px; outline: none; resize: none; margin-bottom: 10px;"></textarea>
        <button onclick="submitInquiry()" style="width: 100%; background: #1f5f43; color:#fff; padding: 10px; border-radius: 8px; font-weight: 800; font-size: 13px; border:0; cursor:pointer;">문의 전송하기</button>
      </div>
      <h4 style="margin: 0 0 12px 0; font-size: 14px; font-weight: 800;">내 문의 내역</h4>
      <div id="inquiry-list" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>

    <!-- 고정 하단 액션 바 -->
    <div class="action-bar" id="product-action-bar"></div>
    <div class="option-sheet" id="bundle-option-sheet" hidden aria-modal="true" role="dialog" aria-labelledby="bundle-option-title">
      <div class="option-sheet-panel">
        <div class="option-sheet-head"><div><h2 id="bundle-option-title">옵션을 선택해 주세요</h2><p>여러 옵션을 함께 신청할 수 있어요.</p></div><button type="button" class="option-sheet-close" onclick="closeBundleOptions()" aria-label="닫기">×</button></div>
        <div class="option-choice-list" id="bundle-option-choice-list"></div>
        <div class="option-sheet-summary"><span>총 신청 금액</span><strong id="bundle-option-total">0원</strong></div>
        <button class="option-sheet-continue" id="bundle-option-continue" type="button" onclick="continueBundleOptions()" disabled>선택한 옵션으로 신청하기</button>
      </div>
    </div>
  </main>

  <script src="./js/auth-session.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/product-rules.js"></script>
  <script src="./js/favorites.js?v=20260805-1"></script>
  <script src="./js/back-navigation.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id") || "bundle-citrus";
    let currentProduct = null;
    let currentImageIndex = 0;
    let restockRequested = false;
    let waitlistRequested = false;

    function accessToken() {
      const direct = localStorage.getItem("todayFridgeAccessToken");
      if (direct) return direct;
      for (let index = 0; index < localStorage.length; index += 1) {
        const key = localStorage.key(index);
        if (!key?.startsWith("sb-") || !key.endsWith("-auth-token")) continue;
        try {
          const session = JSON.parse(localStorage.getItem(key));
          if (session?.access_token) return session.access_token;
          if (session?.currentSession?.access_token) return session.currentSession.access_token;
        } catch (_) {}
      }
      return null;
    }

    function isUUID(str) {
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str);
    }

    function getProductImages(product) {
      if (!product) return [];
      const images = Array.isArray(product.images) && product.images.length > 0
        ? product.images
        : [product.image];
      return images.filter(Boolean);
    }

    function getProductTypeLabel(product) {
      return product.categoryLabel || (product.category === "bundle" ? "공구" : product.category === "fruit" ? "오늘의 과일" : "매장픽");
    }

    function getDeadlineText(product) {
      if (product.deadline === "상시 판매") return "상시 판매";

      const deadlineDate = String(product.deadline || "").match(/(20\d{2})-(\d{2})-(\d{2})/);
      const dateText = deadlineDate
        ? `${Number(deadlineDate[2])}.${Number(deadlineDate[3])}`
        : (product.deadline || "마감일 미정");

      if (product.category !== "bundle" || product.showDeadlineTime === false) {
        return `${dateText} 마감`;
      }

      let deadlineTime = product.deadlineTime || product.deadline_time || "";
      if (!deadlineTime && (product.order_deadline || product.orderDeadline)) {
        const parsedDeadline = new Date(product.order_deadline || product.orderDeadline);
        if (!Number.isNaN(parsedDeadline.getTime())) {
          deadlineTime = `${String(parsedDeadline.getHours()).padStart(2, "0")}:${String(parsedDeadline.getMinutes()).padStart(2, "0")}`;
        }
      }

      const timeMatch = String(deadlineTime).match(/(\d{1,2}):(\d{2})/);
      return `${dateText}${timeMatch ? ` ${String(timeMatch[1]).padStart(2, "0")}:${timeMatch[2]}` : ""} 마감`;
    }

    function getPickupDateText(product) {
      const match = String(product.pickupDate || product.expectedPickupDate || "").match(/(20\d{2})-(\d{2})-(\d{2})/);
      if (!match) return "수령일 미정";
      const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
      return `${match[2]}.${match[3]} (${weekdays[date.getDay()]})`;
    }

    function formatRating(product) {
      const rating = Number(product.rating) || 0;
      return rating.toFixed(1);
    }

    function escapeDetailText(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function updateDetailImage(index) {
      const images = getProductImages(currentProduct);
      if (!images[index]) return;

      currentImageIndex = index;
      const heroImage = document.getElementById("detail-main-image");
      const counter = document.getElementById("gallery-counter");

      if (heroImage) {
        heroImage.src = images[index];
        heroImage.alt = `${currentProduct.name} 사진 ${index + 1}`;
      }
      if (counter) {
        counter.textContent = `${index + 1} / ${images.length}`;
      }

      document.querySelectorAll(".detail-thumbnail").forEach((button, buttonIndex) => {
        button.classList.toggle("is-active", buttonIndex === index);
      });
    }

    window.updateDetailImage = updateDetailImage;

    function syncDetailFavoriteButton() {
      const btn = document.getElementById("btn-detail-favorite");
      if (!btn || !currentProduct || !window.Favorites) return;
      const isFavorite = window.Favorites.has(currentProduct.id);
      btn.setAttribute("aria-pressed", isFavorite ? "true" : "false");
      btn.setAttribute("aria-label", isFavorite ? "찜 해제하기" : "찜하기");
      btn.textContent = isFavorite ? "♥" : "♡";
    }

    // 상세·목록·찜 페이지가 같은 Supabase 찜 데이터를 사용한다.
    window.toggleDetailFavorite = async function () {
      if (!currentProduct || !window.Favorites) return;
      const btn = document.getElementById("btn-detail-favorite");
      if (btn) btn.disabled = true;
      try {
        await window.Favorites.toggle(currentProduct.id);
        syncDetailFavoriteButton();
      } catch (error) {
        alert(error?.message || "찜 상태를 변경하지 못했습니다. 잠시 후 다시 시도해 주세요.");
      } finally {
        if (btn) btn.disabled = false;
      }
    };

    function initProductDetail() {
      const products = window.FridgeDB?.getProducts ? window.FridgeDB.getProducts() : [];
      currentProduct = products.find(p => p.id === productId);

      if (!currentProduct) {
        if (window.FridgeDB?.isCatalogLoaded && !window.FridgeDB.isCatalogLoaded()) {
          document.getElementById("product-detail-content").innerHTML = `
            <div style="padding: 40px; text-align: center;">불러오는 중...</div>
          `;
          return;
        }
        document.getElementById("product-detail-content").innerHTML = `
          <div style="text-align:center; padding: 50px 20px; color:#888;">
            존재하지 않는 상품입니다.
          </div>
        `;
        return;
      }

      const images = getProductImages(currentProduct);
      currentImageIndex = 0;
      const isReservationProduct = currentProduct.purchaseMode === "reservation" || currentProduct.category === "bundle";
      const isFruitProduct = currentProduct.category === "fruit";
      const fruitPriceOptions = (currentProduct.detailSpecs || []).filter((spec) => spec?.type === "price" && Number(spec.price) > 0);
      
      // ProductRules.js에서 만들어낸 원형 배지 HTML 가져오기
      const badgeListHTML = window.ProductRules?.renderBadgeChips ? window.ProductRules.renderBadgeChips(currentProduct) : "";

      const isSoldOut = window.ProductRules ? window.ProductRules.isSoldOut(currentProduct) : false;
      const canJoinWaitlist = window.ProductRules ? window.ProductRules.canJoinWaitlist(currentProduct) : false;
      const priceView = window.ProductRules ? window.ProductRules.priceView(currentProduct) : { hidden: false, current: currentProduct.price };
      
      let priceSection = "";
      if (isSoldOut) {
        priceSection = "";
      } else if (isFruitProduct && fruitPriceOptions.length) {
        priceSection = `<div class="detail-fruit-prices">${fruitPriceOptions.map((option) => `
          <div><span>${option.title}</span><strong>${Number(option.price).toLocaleString("ko-KR")}원</strong></div>
        `).join("")}</div>`;
      } else {
        priceSection = `
          <h2>
            ${(priceView.current || currentProduct.price).toLocaleString()}원${currentProduct.options?.length ? '~' : ''}
            ${priceView.showOriginal ? `<span class="price-strike">${currentProduct.originalPrice.toLocaleString()}원</span>` : ""}
          </h2>
        `;
      }

      const detailHero = document.getElementById("product-detail-content");
      detailHero.innerHTML = `
        <div class="detail-gallery">
          <div class="detail-main-photo">
            <img id="detail-main-image" src="${images[0] || ''}" alt="${currentProduct.name} 사진 1" />
            <span class="gallery-counter" id="gallery-counter">1 / ${images.length}</span>
          </div>
          <div class="detail-thumbnails" aria-label="상품 사진 목록">
            ${images.map((image, index) => `
              <button class="detail-thumbnail ${index === 0 ? 'is-active' : ''}" type="button" onclick="updateDetailImage(${index})">
                <img src="${image}" alt="" />
              </button>
            `).join('')}
          </div>
        </div>
        <div class="detail-info-block">
          <span class="detail-type-chip">${getProductTypeLabel(currentProduct)}</span>
          <h1>${currentProduct.name}</h1>
          <div class="detail-meta-row">
            <span class="detail-meta-item review">★ ${formatRating(currentProduct)} <small>(${currentProduct.reviewsCount || 0})</small></span>
            ${isReservationProduct ? `
              <span class="detail-meta-divider"></span>
              <span class="detail-meta-item"><span class="detail-deadline-icon"></span>${getDeadlineText(currentProduct)}</span>
            ` : ''}
          </div>
          ${isReservationProduct ? `
            <div class="detail-pickup-info">
              <span>수령일</span>
              <strong>${getPickupDateText(currentProduct)}</strong>
            </div>
          ` : ''}
          <p class="detail-description" style="white-space:pre-line">${currentProduct.description || ''}</p>
          <div class="detail-price-box">${priceSection}</div>
          ${badgeListHTML ? `<div class="detail-badge-list">${badgeListHTML}</div>` : ''}
          ${!isReservationProduct ? `<div class="store-purchase-note">이 상품은 매장에서 직접 보고 현장 구매하는 상품입니다.</div>` : ''}
        </div>
      `;

      // 탭 데이터 구성
      const registeredDetailText = String(currentProduct.detailDescription || "").trim();
      if (registeredDetailText) {
        document.getElementById("tab-desc").innerHTML = `<p class="detail-copy">${escapeDetailText(registeredDetailText)}</p>`;
      } else if (isFruitProduct) {
        const specs = (currentProduct.detailSpecs || []).filter((spec) => spec?.type !== "price");
        document.getElementById("tab-desc").innerHTML = `
          <div class="detail-spec-list">
            ${specs.map((spec) => `
              <article class="detail-spec-card">
                <strong>${spec.title}</strong>
                ${spec.body ? `<p>${spec.body}</p>` : ''}
              </article>
            `).join('')}
          </div>
        `;
      } else if (!isReservationProduct) {
        document.getElementById("tab-desc").innerHTML = `
          <div style="font-size: 13px; color:#555; display:flex; flex-direction:column; gap:12px;">
            <p><strong>구매 방법:</strong> 매장 방문 후 상품 상태를 확인하고 현장에서 결제합니다.</p>
            <p><strong>추천 안내:</strong> 재고는 매장 상황에 따라 달라질 수 있어 방문 전 소통방 확인을 권장합니다.</p>
            <p><strong>보관 방법:</strong> 상품별 안내에 따라 냉장 또는 실온 보관해 주세요.</p>
          </div>
        `;
      } else {
        document.getElementById("tab-desc").innerHTML = `
          <div style="font-size: 13px; color:#555; display:flex; flex-direction:column; gap:12px;">
            <p><strong>수령 방법:</strong> 매장 내 셀프 보관함에서 수령증 바코드를 스캔하여 픽업</p>
            <p><strong>보관 방법:</strong> 즉시 섭취 또는 신선 보관실 냉장 보관 권장</p>
            <p><strong>특이 사항:</strong> 산지 상황에 따라 입고 시간이 10~20분 변동될 수 있습니다.</p>
          </div>
        `;
      }

      renderProductReviews();
      renderInquiryList();

      // 하단 액션 바
      const actionBar = document.getElementById("product-action-bar");
      const isFav = window.Favorites?.has?.(currentProduct.id) === true;
      
      const favBtnHTML = `
        <button class="action-favorite-btn" id="btn-detail-favorite" type="button" 
          aria-pressed="${isFav ? 'true' : 'false'}" onclick="toggleDetailFavorite()" aria-label="찜하기">
          ${isFav ? '♥' : '♡'}
        </button>
      `;

      if (!isReservationProduct) {
        actionBar.style.display = "none";
      } else if (isSoldOut) {
        actionBar.style.display = "block";
        let ctaHTML = "";
        if (canJoinWaitlist) {
          ctaHTML = `
            <button class="action-btn" id="btn-action-cta" onclick="orderProduct('waitlist')">
              ${waitlistRequested ? '대기 신청 정보 확인' : '보따리 대기 신청하기'}
            </button>
          `;
        } else {
          ctaHTML = `
            <button class="action-btn restock" id="btn-action-cta" onclick="requestRestock()">
              ${restockRequested ? '재입고 알림 신청 취소' : '재입고 알림 신청하기'}
            </button>
          `;
        }
        actionBar.innerHTML = `<div class="action-bar-inner">${favBtnHTML}${ctaHTML}</div>`;
      } else {
        actionBar.style.display = "block";
        const optionLabel = currentProduct.options?.length
          ? "옵션 선택하기"
          : `보따리 예약 신청하기 (${currentProduct.price.toLocaleString()}원)`;
        const ctaHTML = `
          <button class="action-btn" id="btn-action-cta" onclick="orderProduct()">
            ${optionLabel}
          </button>
        `;
        actionBar.innerHTML = `<div class="action-bar-inner">${favBtnHTML}${ctaHTML}</div>`;
      }
    }

    window.switchDetailTab = function (tab, activeButton) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      activeButton?.classList.add("active");

      document.getElementById("tab-desc").style.display = "none";
      document.getElementById("tab-reviews").style.display = "none";
      document.getElementById("tab-inquiry").style.display = "none";

      if (tab === "desc") document.getElementById("tab-desc").style.display = "block";
      else if (tab === "reviews") document.getElementById("tab-reviews").style.display = "block";
      else if (tab === "inquiry") document.getElementById("tab-inquiry").style.display = "block";
    };

    function renderProductReviews() {
      const container = document.getElementById("tab-reviews");
      const tabBtn = document.getElementById("tab-reviews-btn");
      const reviews = (window.FridgeDB?.getReviews ? window.FridgeDB.getReviews() : []).filter(r => {
        if (r.isVisible === false) return false;
        if (currentProduct?.fruitTypeId) return r.fruitTypeId === currentProduct.fruitTypeId;
        return r.productId === productId;
      });
      
      if (tabBtn) tabBtn.textContent = `후기란 (${reviews.length})`;
      container.innerHTML = "";

      if (reviews.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 30px; color:#888; font-size:13px;">아직 작성된 구매 후기가 없습니다.</div>`;
        return;
      }

      reviews.forEach(r => {
        const div = document.createElement("div");
        div.className = "review-item-detail";
        const stars = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
        let replyHTML = r.reply ? `
          <div style="margin-top:10px; padding:10px; background:#f4f9f6; border-radius:10px; font-size:11px; border-left:3px solid #1f5f43; color:#333; line-height:1.45;">
            <strong style="color:#1f5f43; display:block; margin-bottom:2px;">🏪 사장님 답글</strong>
            ${r.reply}
          </div>
        ` : "";

        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="color: #4f8f64; font-size:14px;">${stars} ${r.userName}</strong>
            <span style="color:#9299a1; font-size:11px;">${r.date}</span>
          </div>
          <p style="margin:6px 0; font-size:13px; color:#333; line-height:1.45;">${r.comment}</p>
          ${replyHTML}
        `;
        container.appendChild(div);
      });
    }

    window.requestRestock = async function () {
      if (!currentProduct) return;
      const token = accessToken();
      if (!token) {
        alert("재입고 알림 신청은 로그인 후 이용 가능합니다.");
        location.href = `./login.html?next=${encodeURIComponent(`product-detail.html?id=${currentProduct.id}`)}`;
        return;
      }

      if (restockRequested) {
        if (confirm("재입고 알림 신청을 취소할까요?")) {
          restockRequested = false;
          alert("재입고 알림 신청을 취소했습니다.");
          initProductDetail();
        }
        return;
      }

      restockRequested = true;
      alert("🔔 재입고 알림 신청이 완료되었습니다!");
      initProductDetail();
    };

    window.orderProduct = function (mode) {
      if (!currentProduct) return;
      const token = accessToken();
      const modeParam = mode === 'waitlist' ? '&mode=waitlist' : '';
      const targetUrl = `./bundle-apply.html?id=${encodeURIComponent(currentProduct.id)}${modeParam}`;

      if (!token) {
        alert("보따리 신청은 로그인 후 이용 가능합니다.");
        window.location.href = `./login.html?next=${encodeURIComponent(targetUrl)}`;
        return;
      }

      if (mode !== 'waitlist' && Array.isArray(currentProduct.options) && currentProduct.options.length) {
        openBundleOptions();
        return;
      }

      window.location.href = targetUrl;
    };

    let optionSelection = {};
    function renderBundleOptionSheet() {
      const list = document.getElementById('bundle-option-choice-list');
      if (!list || !currentProduct) return;
      list.innerHTML = currentProduct.options.map((option) => {
        const quantity = Number(optionSelection[option.id] || 0);
        const soldOut = Number(option.stock || 0) <= 0;
        const maximum = Math.min(Number(option.stock || 0), Number(option.maxQuantity || option.stock || 0));
        return `<div class="option-choice${quantity ? ' is-selected' : ''}">
          <div class="option-choice-info"><strong>${escapeDetailText(option.name)}</strong><span>${Number(option.price).toLocaleString('ko-KR')}원</span><small>${soldOut ? '마감' : `최대 ${maximum}개 신청 가능`}</small></div>
          <div class="option-choice-qty"><button type="button" onclick="changeBundleOption('${option.id}',-1)" ${quantity <= 0 ? 'disabled' : ''}>−</button><b>${quantity}</b><button type="button" onclick="changeBundleOption('${option.id}',1)" ${soldOut || quantity >= maximum ? 'disabled' : ''}>＋</button></div>
        </div>`;
      }).join('');
      const selected = currentProduct.options.filter((option) => Number(optionSelection[option.id]) > 0);
      const total = selected.reduce((sum, option) => sum + Number(option.price) * Number(optionSelection[option.id]), 0);
      document.getElementById('bundle-option-total').textContent = `${total.toLocaleString('ko-KR')}원`;
      document.getElementById('bundle-option-continue').disabled = selected.length === 0;
    }

    window.openBundleOptions = function () {
      optionSelection = {};
      renderBundleOptionSheet();
      document.getElementById('bundle-option-sheet').hidden = false;
      document.body.style.overflow = 'hidden';
    };
    window.closeBundleOptions = function () {
      document.getElementById('bundle-option-sheet').hidden = true;
      document.body.style.overflow = '';
    };
    window.changeBundleOption = function (optionId, change) {
      const option = currentProduct.options.find((item) => item.id === optionId);
      if (!option) return;
      const maximum = Math.min(Number(option.stock), Number(option.maxQuantity || option.stock));
      optionSelection[optionId] = Math.max(0, Math.min(maximum, Number(optionSelection[optionId] || 0) + change));
      renderBundleOptionSheet();
    };
    window.continueBundleOptions = function () {
      const items = currentProduct.options.map((option) => ({ optionId: option.id, name: option.name, price: option.price, quantity: Number(optionSelection[option.id] || 0) })).filter((item) => item.quantity > 0);
      if (!items.length) return;
      sessionStorage.setItem(`todayFridgeBundleSelection:${currentProduct.id}`, JSON.stringify(items));
      window.location.href = `./bundle-apply.html?id=${encodeURIComponent(currentProduct.id)}`;
    };

    let productInquiries = [];
    function renderInquiryList() {
      const container = document.getElementById("inquiry-list");
      container.innerHTML = "";

      if (productInquiries.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:15px; color:#999; font-size:12px;">등록된 문의 내역이 없습니다.</div>`;
        return;
      }

      productInquiries.forEach((inq, idx) => {
        const item = document.createElement("div");
        item.style.cssText = "border:1px solid #edf0f2; border-radius:10px; padding:12px; font-size:12px; background:#fff;";
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:6px; color:#888;">
            <span>질문 #${idx + 1}</span>
            <span>${inq.date}</span>
          </div>
          <p style="margin:0; font-weight:800; color:#333;">Q. ${inq.question}</p>
        `;
        container.appendChild(item);
      });
    }

    window.submitInquiry = function () {
      const textarea = document.getElementById("inquiry-text");
      const question = textarea.value.trim();
      if (!question) {
        alert("문의하실 내용을 입력해 주세요.");
        return;
      }
      productInquiries.push({
        id: Date.now(),
        question,
        date: new Date().toLocaleDateString("ko-KR")
      });
      textarea.value = "";
      alert("✉️ 문의가 전송되었습니다.");
      renderInquiryList();
    };

    window.addEventListener("todayFridgeCatalogUpdated", initProductDetail);
    window.addEventListener("favoriteschange", syncDetailFavoriteButton);
    initProductDetail();
  </script>
  <script src="./js/receipt-launcher.js"></script>
  <script src="./js/content-protection.js"></script>
</body>
</html>
