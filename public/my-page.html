<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f8f64" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="오늘의 냉장고" />
  <link rel="icon" type="image/svg+xml" href="./assets/brand/오냉로고1.svg" />
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/brand/app-icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>마이페이지 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./css/today-fridge.css" />
  <link rel="stylesheet" href="./css/my-page.css" />
</head>
<body>
  <main class="my-page" aria-label="마이페이지">
    <header class="my-header">
      <h1>마이페이지</h1>
      <p>내 정보와 이용 내역을 한곳에서 관리해요</p>
    </header>

    <section class="profile-card" id="member-profile" aria-label="회원 정보" hidden>
      <div class="profile-avatar" aria-hidden="true"></div>
      <div>
        <strong id="my-user-name"></strong>
        <p id="my-account-provider"></p>
        <p class="profile-noshow" id="my-noshow-count"></p>
      </div>
      <button type="button" data-my-action="profile">정보 수정</button>
    </section>

    <section class="guest-card" id="guest-profile" aria-label="로그인 안내">
      <span class="guest-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 19.5c.8-3.7 3-5.6 6.5-5.6s5.7 1.9 6.5 5.6"/></svg>
      </span>
      <strong>로그인이 필요해요</strong>
      <p>신청 내역과 수령 확인증을 안전하게 확인할 수 있어요.</p>
      <a href="./login.html">로그인하기</a>
      <a class="guest-signup-link" href="./signup.html">처음이신가요? 회원가입</a>
    </section>

    <section class="my-summary" aria-label="이용 현황" data-auth-only>
      <a href="./index.html#receipt" class="summary-card summary-card--receipt">
        <span class="summary-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 3.75h10a2 2 0 0 1 2 2v14.5l-2.35-1.45-2.32 1.45L12 18.8l-2.33 1.45-2.32-1.45L5 20.25V5.75a2 2 0 0 1 2-2Z"/><path d="M8.5 8h7M8.5 11.5h7M8.5 15h4"/></svg>
        </span>
        <span class="summary-copy">
          <strong>수령 확인증</strong>
          <span>주문과 수령 상태 확인</span>
        </span>
        <span class="summary-arrow" aria-hidden="true">›</span>
      </a>
      <a href="./favorites.html" class="summary-card summary-card--favorite">
        <span class="summary-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 20.1S4.5 15.8 4.5 9.85A4.15 4.15 0 0 1 11.6 6.9l.4.42.4-.42a4.15 4.15 0 0 1 7.1 2.95c0 5.95-7.5 10.25-7.5 10.25Z"/></svg>
        </span>
        <span class="summary-copy">
          <strong>찜한 상품</strong>
          <span>관심 상품 다시 보기</span>
        </span>
        <span class="summary-arrow" aria-hidden="true">›</span>
      </a>
    </section>

    <section class="my-menu" aria-label="나의 활동" data-auth-only>
      <h2>나의 활동</h2>
      <a href="./order-history.html"><span>주문 내역</span><b>›</b></a>
      <a href="./index.html#receipt"><span>수령 확인증</span><b>›</b></a>
      <a href="./favorites.html"><span>찜한 상품</span><b>›</b></a>
      <button type="button" data-my-action="inquiries"><span>1:1 문의 내역</span><b>›</b></button>
    </section>

    <section class="my-menu" aria-label="이용 설정" data-auth-only>
      <h2>이용 설정</h2>
      <button type="button" data-my-action="notifications">
        <span class="menu-label"><span>알림 설정</span><small id="push-menu-status">웹 푸시 준비 중</small></span><b>›</b>
      </button>
      <a href="./admin.html" id="admin-menu-link" hidden><span>관리자 센터</span><b>›</b></a>
    </section>

    <button class="logout-button" type="button" data-auth-only data-logout>로그아웃</button>
    <button class="withdraw-button" type="button" data-auth-only data-my-action="withdraw">회원탈퇴</button>
  </main>

  <div class="my-modal" id="my-modal" aria-hidden="true">
    <button class="my-modal-backdrop" type="button" aria-label="창 닫기" data-modal-close></button>
    <section class="my-modal-panel" role="dialog" aria-modal="true" aria-labelledby="my-modal-title">
      <header><h2 id="my-modal-title">마이페이지</h2><button class="my-modal-close" type="button" aria-label="닫기" data-modal-close>×</button></header>
      <div class="my-modal-content" id="my-modal-content"></div>
    </section>
  </div>
  <div class="my-toast" id="my-toast" role="status" aria-live="polite"></div>

  <nav class="bottom-nav" aria-label="하단 네비게이션">
    <a href="./index.html">
      <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.5l8.5 7.3v9.7h-5.4v-6.2H8.9v6.2H3.5z"/></svg>
      홈
    </a>
    <a href="./category.html">
      <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.6"/><rect x="14" y="4" width="6" height="6" rx="1.6"/><rect x="4" y="14" width="6" height="6" rx="1.6"/><rect x="14" y="14" width="6" height="6" rx="1.6"/></svg>
      카테고리
    </a>
    <a href="./index.html#receipt" class="floating-ticket" id="btn-receipt-floating" aria-label="수령 가능 확인증 열기">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-280q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm0-160q17 0 28.5-11.5T520-480q0-17-11.5-28.5T480-520q-17 0-28.5 11.5T440-480q0 17 11.5 28.5T480-440Zm0-160q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm320 440H160q-33 0-56.5-23.5T80-240v-160q33 0 56.5-23.5T160-480q0-33-23.5-56.5T80-560v-160q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v160q-33 0-56.5 23.5T800-480q0 33 23.5 56.5T880-400v160q0 33-23.5 56.5T800-160Zm0-80v-102q-37-22-58.5-58.5T720-480q0-43 21.5-79.5T800-618v-102H160v102q37 22 58.5 58.5T240-480q0 43-21.5 79.5T160-342v102h640Z"/></svg>
    </a>
    <a href="./favorites.html">
      <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2S4.2 15.7 4.2 9.7a4.1 4.1 0 0 1 7-2.9l.8.8.8-.8a4.1 4.1 0 0 1 7 2.9c0 6-7.8 10.5-7.8 10.5z"/></svg>
      찜
    </a>
    <a href="./my-page.html" class="active">
      <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c.9-4 3.5-6.1 7.2-6.1s6.3 2.1 7.2 6.1"/></svg>
      마이
    </a>
  </nav>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js"></script>
  <script src="./js/auth-session.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/push-onboarding.js"></script>
  <script src="./js/my-page.js"></script>
  <script src="./js/receipt-launcher.js"></script>
  <script src="./js/content-protection.js"></script>
</body>
</html>
