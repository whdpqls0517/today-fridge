<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신청 완료 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./css/today-fridge.css">
  <link rel="stylesheet" href="./css/bundle-apply-complete.css">
</head>
<body>
  <main class="complete-page">
    <div class="complete-check" aria-hidden="true">✓</div>
    <h1>신청이 완료되었습니다</h1>
    <p id="complete-guide">신청 내역을 확인해 주세요.</p>

    <section class="complete-summary" id="complete-summary"></section>

    <section class="bank-box" id="bank-box" hidden>
      <div>
        <span>입금하실 금액</span>
        <strong id="bank-amount">0원</strong>
      </div>
      <hr>
      <span>입금 계좌</span>
      <div class="bank-account-line">
        <b id="bank-account">계좌 정보를 불러오는 중입니다</b>
        <button type="button" id="copy-account-button">복사</button>
      </div>
      <small id="bank-holder"></small>

      <div class="remit-section" id="remit-section" hidden>
        <div class="remit-section-title">앱으로 바로 송금하기</div>
        <a href="#" class="remit-option-card" id="toss-remit-btn" hidden>
          <div class="remit-option-left">
            <span class="remit-option-name">토스</span>
            <img src="./images/Toss_Logo_Primary.png" class="remit-logo-img-toss" alt="토스">
          </div>
          <div class="remit-option-right">바로 송금 <span>›</span></div>
        </a>
        <a href="#" class="remit-option-card" id="kakao-remit-btn" hidden>
          <div class="remit-option-left">
            <span class="remit-option-name">카카오페이</span>
            <img src="./images/payment_icon_yellow_large.png" alt="카카오페이" class="remit-logo-img">
          </div>
          <div class="remit-option-right">바로 송금 <span>›</span></div>
        </a>
      </div>
      <p id="payment-info-error" class="payment-info-error" hidden></p>
    </section>

    <div class="complete-actions">
      <a class="primary" href="./order-history.html">주문 내역 확인</a>
      <a href="./index.html">홈으로 돌아가기</a>
    </div>
    <aside id="complete-note"></aside>
  </main>

  <script src="./js/auth-session.js"></script>
  <script src="./js/bundle-apply-complete.js"></script>
</body>
</html>
