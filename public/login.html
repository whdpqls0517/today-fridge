<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | 오늘의 냉장고</title>
  <link rel="icon" type="image/png" href="./assets/brand/today-fridge-favicon.png" />
  <link rel="stylesheet" href="./css/today-fridge.css" />
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>
  <main class="login-page">
    <a class="login-back" href="./my-page.html" aria-label="마이페이지로 돌아가기">‹</a>

    <section class="login-intro">
      <a class="auth-brand" href="./index.html" aria-label="오늘의 냉장고 홈">
        <img src="./assets/brand/today-fridge-wordmark-black-auth-2x.png" alt="오늘의 냉장고" />
      </a>
      <h1>필요한 소식만,<br />놓치지 않게 받아보세요</h1>
      <p>신청 상품의 입고 소식과 수령 확인증을<br />하나의 계정으로 안전하게 관리해요.</p>
    </section>

    <section class="login-actions" aria-label="로그인 방법">
      <button class="kakao-login" type="button" data-login-provider="kakao">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4C6.8 4 2.6 7.3 2.6 11.3c0 2.6 1.8 4.9 4.5 6.2l-1 3.7c-.1.3.3.6.6.4l4.4-2.9h.9c5.2 0 9.4-3.3 9.4-7.4S17.2 4 12 4Z"/></svg>
        카카오로 계속하기
      </button>
      <button class="legacy-google-login" type="button" data-login-provider="google">
        기존 Google 계정 로그인
      </button>
      <p class="signup-link">아직 회원이 아니신가요? <a href="./signup.html">회원가입</a></p>
    </section>

    <footer class="auth-legal-footer">
      <nav class="auth-legal-footer__links" aria-label="서비스 정책">
        <a href="./terms.html">이용약관</a>
        <a href="./privacy.html">개인정보처리방침</a>
      </nav>
      <span class="auth-legal-footer__copyright">© 2026 오늘의 냉장고</span>
    </footer>
  </main>

  <div class="login-toast" id="login-toast" role="status" aria-live="polite"></div>
  <script src="./vendor/supabase.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
