<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>보따리 신청 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./css/today-fridge.css" /><link rel="stylesheet" href="./css/bundle-apply.css">
</head>
<body>
  <main class="apply-page">
    <header><button type="button" data-apply-back aria-label="상품으로 돌아가기">‹</button><h1>보따리 신청</h1><i></i></header>
    <section class="apply-product" id="apply-product"></section>
    <form id="bundle-apply-form">
      <section class="apply-section"><div class="apply-heading"><span>1</span><div><h2>수량을 선택해 주세요</h2><p>남은 수량 안에서 신청할 수 있어요.</p></div></div><div class="quantity-control"><button type="button" data-quantity="-1">−</button><strong id="apply-quantity">1</strong><button type="button" data-quantity="1">＋</button></div></section>
      <section class="apply-section"><div class="apply-heading"><span>2</span><div><h2>수령 희망일</h2><p>가능한 날짜 중 하루를 선택해 주세요.</p></div></div><div class="date-options" id="apply-date-options"></div></section>
      <section class="apply-section"><div class="apply-heading"><span>3</span><div><h2>방문 시간대</h2><p>방문하실 시간대를 선택해 주세요.</p></div></div><div class="choice-grid"><label><input type="radio" name="pickupTime" value="오후 7시 이전" checked><span><b>오후 7시 이전</b><small>이른 시간대 방문</small></span></label><label><input type="radio" name="pickupTime" value="오후 7시 이후"><span><b>오후 7시 이후</b><small>늦은 시간대 방문</small></span></label></div></section>
      <section class="apply-section"><div class="apply-heading"><span>4</span><div><h2>결제 방식</h2><p id="payment-help">원하는 결제 방식을 선택해 주세요.</p></div></div><div class="choice-grid"><label id="onsite-choice"><input type="radio" name="paymentType" value="onsite" checked><span><b>현장결제</b><small>수령 시 키오스크 결제</small></span></label><label><input type="radio" name="paymentType" value="transfer"><span><b>선결제</b><small>결제 확인 후 수령 가능</small></span></label></div><label class="depositor-field" id="depositor-field" hidden><span>입금자명 <small>미입력 시 주문자명과 동일</small></span><input id="depositor-name" maxlength="20" placeholder="주문자와 다를 경우만 입력"></label></section>
      <section class="amount-box"><div><span>결제 예정 금액</span><strong id="apply-amount">0원</strong></div><p>수량과 결제 방식을 다시 확인해 주세요.</p></section>
      <div class="agreement-panel">
        <strong>신청 전 확인해 주세요</strong>
        <label class="agreement">
          <input id="apply-agreement" type="checkbox" required>
          <span id="procurement-agreement-text">신청 수량에 맞춰 준비되는 상품으로, 신청 마감 후에는 취소가 제한될 수 있음을 확인했습니다.</span>
        </label>
        <a class="agreement-link" href="./terms.html#order-cancellation" target="_blank" rel="noopener">취소·청약철회 기준 보기</a>
      </div>
      <button class="apply-submit" type="submit">신청하기</button>
      <p class="apply-message" id="apply-message"></p>
    </form>
  </main>
  <script src="./js/auth-session.js"></script><script src="./js/db.js"></script><script src="./js/product-rules.js"></script><script src="./js/bundle-apply.js"></script>
</body></html>
