<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 작업 이력 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./css/today-fridge.css">
  <link rel="stylesheet" href="./css/admin-audit-log.css">
</head>
<body>
  <main class="audit-page">
    <header>
      <a href="./admin.html">‹ 관리자 센터</a>
      <div><h1>관리자 작업 이력</h1><p>관리자와 자동 처리 시스템이 변경한 내용을 확인합니다.</p></div>
      <button id="audit-refresh" type="button">새로고침</button>
    </header>
    <section class="audit-tools">
      <label>작업 종류
        <select id="audit-action">
          <option value="">전체</option>
          <option value="product_created">상품 등록</option>
          <option value="product_updated">상품 수정</option>
          <option value="product_settings_updated">상품 설정 변경</option>
          <option value="product_deleted">상품 삭제</option>
          <option value="order_cancelled">주문 취소</option>
          <option value="payment_confirmed">입금 승인</option>
          <option value="payment_auto_expired">입금 자동 만료</option>
        </select>
      </label>
    </section>
    <p class="audit-state" id="audit-state">작업 이력을 불러오고 있어요.</p>
    <section class="audit-list" id="audit-list" aria-live="polite"></section>
  </main>
  <script src="./js/admin-audit-log.js"></script>
</body>
</html>
