<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./today-fridge.css" />
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>
  <main class="login-page">
    <a class="login-back" href="./my-page.html" aria-label="마이페이지로 돌아가기">‹</a>

    <section class="login-intro">
      <span class="login-eyebrow">오늘의 냉장고</span>
      <h1>필요한 소식만,<br />놓치지 않게 받아보세요</h1>
      <p>신청 상품의 입고 소식과 수령 확인증을<br />하나의 계정으로 안전하게 관리해요.</p>
    </section>

    <section class="login-actions" aria-label="로그인 방법">
      <button class="kakao-login" type="button" data-login-provider="kakao">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4C6.8 4 2.6 7.3 2.6 11.3c0 2.6 1.8 4.9 4.5 6.2l-1 3.7c-.1.3.3.6.6.4l4.4-2.9h.9c5.2 0 9.4-3.3 9.4-7.4S17.2 4 12 4Z"/></svg>
        카카오로 계속하기
      </button>
      <div class="login-divider"><span>또는</span></div>
      <button class="google-login" type="button" data-login-provider="google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.06H12v3.9h5.38a4.6 4.6 0 0 1-2 3.02v2.53h3.24c1.9-1.75 2.98-4.33 2.98-7.39Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.98-.9 6.64-2.42l-3.24-2.53c-.9.6-2.05.96-3.4.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.61A10.03 10.03 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.39 13.88A6.02 6.02 0 0 1 6.07 12c0-.65.11-1.29.32-1.88V7.51H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.49l3.35-2.61Z"/>
          <path fill="#EA4335" d="M12 5.99c1.47 0 2.79.5 3.82 1.49l2.89-2.89A9.68 9.68 0 0 0 12 2a10.03 10.03 0 0 0-8.96 5.51l3.35 2.61C7.18 7.75 9.39 5.99 12 5.99Z"/>
        </svg>
        Google로 계속하기
      </button>
      <p class="login-note">처음 로그인하면 자동으로 회원가입되며,<br />서비스 이용에 필요한 최소 정보만 저장해요.</p>
    </section>

    <footer class="login-footer">
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
    </footer>
  </main>

  <div class="login-toast" id="login-toast" role="status" aria-live="polite"></div>
  <script src="http://localhost:3000/vendor/supabase.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
