<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>검색 결과 | 오늘의 냉장고</title>
  <link rel="stylesheet" href="./today-fridge.css" />
</head>
<body class="search-screen">
  <main class="search-page result-page" aria-label="검색 결과 화면">
    <header class="search-header">
      <a class="search-back" href="./search.html" data-back-button aria-label="이전 화면으로 돌아가기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </a>
      <form class="search-field" data-search-form>
        <input data-search-input type="search" placeholder="보따리, 과일, 밀키트 검색" />
        <button class="search-submit" type="submit" aria-label="검색하기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.1"/><path d="m16 16 4 4"/></svg>
        </button>
      </form>
    </header>

    <section class="result-summary">
      <span>검색 결과</span>
      <h1><strong data-result-keyword>검색어</strong></h1>
      <p>실제 상품 목록은 Supabase 상품 데이터 연결 후 이 영역에 표시됩니다.</p>
    </section>

    <section class="popular-products" aria-label="검색 결과 예시">
      <div class="search-section-title">
        <h2>관련 상품</h2>
      </div>
      <div class="popular-track" id="search-results-track" style="flex-wrap: wrap; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; overflow: visible;">
        <!-- JS로 동적 렌더링 됩니다 -->
      </div>
    </section>
  </main>

  <script src="./js/db.js"></script>
  <script src="./js/product-rules.js"></script>
  <script src="./js/back-navigation.js"></script>
  <script src="./js/search.js"></script>
  <script src="./js/favorites.js"></script>
  <script src="./js/receipt-launcher.js"></script>
</body>
</html>
